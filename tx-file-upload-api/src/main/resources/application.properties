############################
# Basic server configuration
############################
server.port=8082
spring.application.name=tx-file-upload-api
server.servlet.context-path=/txfu
################################
# Actuator routing configuration
################################
management.endpoints.web.base-path=/api/v1
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
########################
# Database configuration
########################
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
#######################
# Logging configuration
#######################
logging.level.com.lblandi=DEBUG
logging.level.org.springframework.web=DEBUG