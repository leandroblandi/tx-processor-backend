############################
# Basic server configuration
############################
server.port=8081
spring.application.name=tx-file-processing-api
server.servlet.context-path=/txfp
################################
# Actuator routing configuration
################################
management.endpoints.web.base-path=/api/v1
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
########################
# Database configuration
########################
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#######################
# Logging configuration
#######################
logging.level.com.lblandi=DEBUG
logging.level.org.springframework.web=DEBUG